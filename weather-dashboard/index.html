<!doctype html>
<html class="no-js" lang="pt">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Dashboard for weather data visualization">

  <meta property="og:title" content="Weather Dashboard">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.example.com/weather-dashboard">  <meta property="og:image" content="">
  <meta property="og:image:alt" content="Weather Dashboard Image">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <div class="container">
    <h1>Weather Dashboard</h1>
    <div class="search">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
    </div>
    <div class="weather-info" id="weatherInfo">
        <!-- Weather data will be displayed here -->
    </div>
  </div>
  <script src="js/app.js"></script>

</body>

</html>
